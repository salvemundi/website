<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<title>Molproef</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
.home{max-width:760px;width:100%}
.home h1{font:400 clamp(56px,9vw,96px)/1 var(--serif);letter-spacing:-0.02em}
.home > p{color:var(--muted);font-size:18px;margin-top:14px;max-width:48ch;text-wrap:balance}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.choices a{display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);text-decoration:none;transition:border-color .15s, background .15s, transform .12s var(--ease-out)}
.choices a:hover{border-color:var(--accent);background:var(--surface)}
.choices a:active{transform:scale(.99)}
.choices a b{font:400 30px/1 var(--serif)}
.choices a span{color:var(--muted);font-size:14px}
.choices a.primary{border-color:oklch(0.83 0.12 78 / .5);background:var(--accent-wash)}
.choices svg{width:22px;height:22px;color:var(--accent)}
@media (max-width:560px){ .choices{grid-template-columns:1fr} }
</style>
</head>
<body>
<main class="center-screen"><div class="home enter">
  <h1>Molproef</h1>
  <p>Na elke proef een test over de mol. Wie de mol het slechtst kent, valt af.</p>
  <div class="choices">
    <a class="primary" href="/invul"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg><b>Test invullen</b><span>Voor kandidaten. Kies je naam en maak de test die open staat.</span></a>
    <a href="/beheer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><b>Beheer</b><span>Voor de spelleiding. Alleen met pincode.</span></a>
  </div>
</div></main>
</body>
</html>
