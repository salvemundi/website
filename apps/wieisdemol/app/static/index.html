<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123524">
<title>Wie is de mol?</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
.home{max-width:760px;width:100%;text-align:center}
.home .logo{height:86px;margin:0 auto 22px}
.home .kicker{font:400 clamp(28px,4vw,40px)/1 var(--serif);color:var(--accent)}
.home h1{font:400 clamp(60px,10vw,108px)/1.02 var(--serif);letter-spacing:-0.01em;text-shadow:0 5px 0 oklch(0.12 0.03 155 / .45);margin-top:6px}
.home > p{color:var(--muted);font-size:18px;margin:16px auto 0;max-width:48ch;text-wrap:balance}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px;text-align:left}
.choices a{display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--text);text-decoration:none;transition:border-color .15s, background .15s, transform .12s var(--ease-out)}
.choices a:hover{border-color:var(--accent);background:var(--surface)}
.choices a:active{transform:scale(.99)}
.choices a b{font:400 32px/1 var(--serif)}
.choices a span{color:var(--muted);font-size:14px}
.choices a.primary{border-color:oklch(0.8 0.1 138 / .5);background:oklch(0.25 0.06 152 / .8)}
.choices svg{width:22px;height:22px;color:var(--accent)}
@media (max-width:560px){ .choices{grid-template-columns:1fr} }
</style>
</head>
<body>
<main class="center-screen"><div class="home enter">
  <img class="logo" src="/assets/logo.svg" alt="Salve Mundi">
  <p class="kicker">Kamp 2026</p>
  <h1>Wie is de mol?</h1>
  <p>Na elke proef een test over de twee mollen. Wie de mollen het slechtst kent, valt af.</p>
  <div class="choices">
    <a class="primary" href="/invul"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg><b>Test invullen</b><span>Voor kandidaten. Open de persoonlijke link die je van de spelleiding hebt gekregen.</span></a>
    <a href="/beheer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><b>Beheer</b><span>Voor de spelleiding. Alleen met wachtwoord.</span></a>
  </div>
</div></main>
</body>
</html>
