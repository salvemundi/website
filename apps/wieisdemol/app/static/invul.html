<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Molproef · Invullen</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
.top{display:flex;align-items:center;gap:14px;padding:18px 24px;max-width:1040px;margin:0 auto}
.top b{font:400 24px/1 var(--serif)}
.top .camp{color:var(--faint);font-size:13px}
.timer{font:500 15px var(--sans);color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.wrap{max-width:1040px;margin:0 auto;padding:24px 24px 120px}
.wrap.mid{min-height:calc(100vh - 70px);display:flex;flex-direction:column;justify-content:center;padding-bottom:80px}
.lead{color:var(--muted);font-size:18px;max-width:56ch;margin-top:18px}
.search{max-width:520px;margin-top:24px}
.search input{padding:14px 16px;font-size:17px}
.names{margin-top:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px}
.qbar{display:flex;gap:4px;margin:12px 0 30px;max-width:760px}
.qbar i{height:4px;flex:1;border-radius:4px;background:var(--surface-2)}
.qbar i.on{background:var(--accent)}
.qbar i.cur{background:var(--text)}
.qtitle{font:400 clamp(32px,4.4vw,58px)/1.08 var(--serif);letter-spacing:-0.015em;max-width:24ch}
.options{display:grid;gap:10px;margin-top:30px;max-width:760px}
.opt{
  appearance:none;cursor:pointer;display:flex;align-items:center;gap:16px;text-align:left;width:100%;
  background:var(--bg-2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:16px 18px;
  font:500 18px/1.3 var(--sans);transition:border-color .15s, background .15s, transform .12s var(--ease-out);
}
.opt:hover{border-color:var(--line-2);background:var(--surface)}
.opt:active{transform:scale(.99)}
.opt kbd{font:500 13px var(--sans);width:28px;height:28px;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);flex:none}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-wash)}
.opt[aria-pressed=true] kbd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.foot{display:flex;gap:10px;margin-top:30px;align-items:center;flex-wrap:wrap}
.keys{color:var(--faint);font-size:13px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

@media (max-width:640px){
  .top{padding:14px 16px}
  .wrap{padding:16px 16px 120px}
  .names{grid-template-columns:repeat(2,minmax(0,1fr))}
  .names button{padding:13px 12px;font-size:15px}
  .keys{display:none}
  .foot{position:fixed;left:0;right:0;bottom:0;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:oklch(0.155 0.012 255 / .94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .foot .btn{flex:1}
  .opt{font-size:17px;padding:15px 14px}
}
@media (hover: none){ .keys{display:none} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/common.js"></script>
<script src="/assets/invul.js"></script>
</body>
</html>
