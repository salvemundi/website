<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<title>Molproef · Beheer</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
/* layout */
.layout{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:oklch(0.17 0.013 255);padding:20px 12px 16px;display:flex;flex-direction:column}
.brand{padding:0 10px 18px}
.brand b{font:400 28px/1 var(--serif);display:block}
.brand span{color:var(--faint);font-size:13px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-h{font:500 12px var(--sans);color:var(--faint);padding:16px 10px 6px}
.nav button{appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--sans);padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.nav button:hover{color:var(--text);background:var(--surface)}
.nav button[aria-current=true]{color:var(--text);background:var(--surface-2)}
.nav .tn{font:400 18px/1 var(--serif);width:22px;text-align:center;color:var(--faint);flex:none}
.nav button[aria-current=true] .tn{color:var(--accent)}
.nav .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:12px;color:var(--faint)}
.sd{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line-2)}
.sd.open{background:var(--go);box-shadow:0 0 0 3px oklch(0.64 0.17 148 / .18)}
.sd.dicht{background:var(--muted)}
.sd.klaar{background:var(--accent)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.savestate{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.savestate.error{color:var(--out-text)}
.main{padding:40px 48px 100px;max-width:1120px;width:100%}

.ph{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.ph h1{font:400 46px/1.02 var(--serif);letter-spacing:-0.015em}
.ph p{color:var(--muted);margin-top:8px;max-width:64ch}
.sec{margin-top:40px}
.sec > h2{font:400 26px/1.1 var(--serif);margin-bottom:6px}
.sec > p.lead{margin:0 0 16px;color:var(--muted);max-width:68ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* overzicht */
.next{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:22px 24px;border-color:oklch(0.83 0.12 78 / .35);background:linear-gradient(180deg, var(--accent-wash), transparent 140%)}
.next h2{font:400 24px/1.1 var(--serif);margin-bottom:6px}
.next p{color:var(--muted);max-width:60ch}
.link-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.link-box code{font:500 19px/1.2 var(--sans);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;word-break:break-all}

/* tabellen */
table{width:100%;border-collapse:collapse}
th{font:500 12px var(--sans);color:var(--faint);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid oklch(0.31 0.016 255 / .6);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tbody tr:hover td{background:oklch(0.215 0.016 255 / .45)}
tr.clickable{cursor:pointer}
td input[type=text]{background:transparent;border-color:transparent;padding:6px 8px}
td input[type=text]:hover{border-color:var(--line)}
td input[type=text]:focus{background:var(--bg);border-color:var(--accent)}
tr.out td{background:oklch(0.57 0.2 27 / .06)}

/* stappen */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-2)}
.steps button{appearance:none;border:0;border-right:1px solid var(--line);background:none;color:var(--text);cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px;text-align:left;position:relative;min-width:0}
.steps button:last-child{border-right:0}
.steps button:hover{background:var(--surface)}
.steps button[aria-current=true]{background:var(--surface-2)}
.steps button[aria-current=true]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.steps .sn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font:500 13px var(--sans);color:var(--muted);flex:none}
.steps .done .sn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps .live .sn{border-color:var(--go);color:var(--go-text)}
.steps b{display:block;font:500 14px/1.2 var(--sans)}
.steps small{display:block;color:var(--faint);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* vragen */
.qgroup{margin-top:30px}
.qgroup > h3{font:400 22px/1.1 var(--serif);display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.qgroup > h3 span{font:400 13px var(--sans);color:var(--faint)}
.qrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;padding:16px 0;border-bottom:1px solid oklch(0.31 0.016 255 / .6)}
.qrow .qn{font:400 22px/1 var(--serif);color:var(--faint);padding-top:2px}
.qrow .qt{font-weight:500;font-size:15px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.choice{appearance:none;font:500 13px/1 var(--sans);padding:8px 11px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
button.choice{cursor:pointer;transition:border-color .15s, background .15s, color .15s}
button.choice:hover{border-color:var(--line-2);color:var(--text)}
.choice.sel{border-color:var(--accent);background:var(--accent-wash);color:var(--text)}
.choice.sel svg{color:var(--accent);width:15px;height:15px}
span.choice.dim{opacity:.5}
.qnote{font-size:12px;color:var(--faint);margin-top:9px;display:flex;gap:6px;align-items:center}
.qnote.miss{color:var(--out-text)}
.qacts{display:flex;gap:2px;align-items:flex-start}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.addbar select{width:auto;max-width:340px}

/* afnemen */
.big{font:400 64px/1 var(--serif)}
.progress{height:6px;background:var(--surface);border-radius:6px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s var(--ease-out)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip.done{color:var(--muted);background:transparent}
.chip.red{color:var(--out-text);border-color:oklch(0.57 0.2 27 / .45);background:oklch(0.57 0.2 27 / .1)}
.chip button{appearance:none;border:0;background:none;color:var(--faint);cursor:pointer;padding:0;display:flex}
.chip button:hover{color:var(--out-text)}
.chip button svg{width:14px;height:14px}
.live-dot{display:inline-flex;align-items:center;gap:7px;color:var(--go-text);font-size:13px}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--go);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{appearance:none;border:0;background:var(--surface);color:var(--text);width:28px;height:28px;cursor:pointer;font:500 15px var(--sans)}
.stepper button:hover{background:var(--surface-2)}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper span{min-width:28px;text-align:center;font-size:13px}

/* mol */
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:center}
.kv > .k{padding:12px 0;border-bottom:1px solid oklch(0.31 0.016 255 / .6);display:flex;gap:8px;align-items:center}
.kv > .v{padding:12px 0;border-bottom:1px solid oklch(0.31 0.016 255 / .6)}
.veil{position:relative}
.veil.closed > .veil-in{filter:blur(9px);pointer-events:none;user-select:none}
.veil-cover{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.blur-name{filter:blur(7px);transition:filter .25s var(--ease-out);user-select:none}
.blur-name.show{filter:none;user-select:auto}

/* presentatie */
.present{position:fixed;inset:0;z-index:40;background:var(--bg);background-image:radial-gradient(120% 80% at 50% -10%, oklch(0.22 0.025 255) 0%, transparent 60%);overflow-y:auto}
.present-top{display:flex;align-items:center;gap:16px;padding:20px 32px}
.present-top b{font:400 26px/1 var(--serif)}
.present-main{max-width:1100px;margin:0 auto;padding:20px 32px 80px}
.present .names button.done{opacity:.35;pointer-events:none}
.present .names button.done.r{opacity:1;background:var(--out-deep);border-color:var(--out);color:var(--text)}
.corner{position:fixed;right:18px;bottom:16px;z-index:45}
.stage{position:fixed;inset:0;z-index:50;background:oklch(0.11 0.01 255);display:grid;place-items:center;cursor:pointer;overflow:hidden}
.stage .who{position:relative;z-index:2;text-align:center;padding:0 24px}
.stage .hint{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:var(--faint);font-size:14px;z-index:2}
.stage .fill{position:absolute;inset:0;clip-path:inset(50% 0 50% 0);z-index:1}
.stage.go .fill{background:radial-gradient(120% 120% at 50% 50%, oklch(0.62 0.18 148), oklch(0.42 0.14 150))}
.stage.out .fill{background:radial-gradient(120% 120% at 50% 50%, oklch(0.56 0.21 27), oklch(0.34 0.15 25))}
.stage.unmask .fill{background:radial-gradient(60% 60% at 50% 50%, oklch(0.27 0.045 70), oklch(0.11 0.01 255))}
.stage.shown .fill{clip-path:inset(0 0 0 0);transition:clip-path 1.1s var(--ease-out)}
.stage.shown .hint{color:oklch(1 0 0 / .75)}
.stage .scan{width:min(420px,70vw);height:2px;margin:34px auto 0;background:var(--surface-2);border-radius:2px;overflow:hidden}
.stage .scan i{display:block;height:100%;width:0;background:var(--accent)}
.stage.wait .scan i{width:100%;transition:width var(--wait,3s) linear}
.stage.shown .scan{opacity:0;transition:opacity .3s}
.who.hide-name .display{opacity:0;filter:blur(18px);transform:scale(.96)}
.stage.shown .who.hide-name .display{opacity:1;filter:none;transform:none;transition:opacity .9s var(--ease-out),filter 1.2s var(--ease-out),transform 1.2s var(--ease-out)}
.stage.unmask .display{color:var(--accent)}
.pinbox{position:fixed;inset:0;z-index:60;background:oklch(0.11 0.01 255 / .92);display:grid;place-items:center;padding:16px}

@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
  .nav-h{width:100%;padding-top:10px}
  .main{padding:28px 16px 80px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps button:nth-child(2){border-right:0}
  .steps button:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .qrow{grid-template-columns:24px minmax(0,1fr)}
  .qacts{grid-column:2}
}
@media (prefers-reduced-motion: reduce){ .stage.shown .fill{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="present"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="/assets/common.js"></script>
<script src="/assets/beheer.js"></script>
</body>
</html>
