packages:
  - "apps/frontend"
  - "apps/services/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": false
  core-js-pure: false
  es5-ext: false
  esbuild: false
  puppeteer: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

overrides:
  sharp: "0.35.5"
  "@img/sharp-win32-x64": "0.35.5"
  "@img/sharp-linuxmusl-x64": "0.35.5"
  "@img/sharp-libvips-linuxmusl-x64": "1.3.2"
  react: "^19.2.7"
  react-dom: "^19.2.7"
  better-auth: "1.7.7"
  "@better-auth/core": "1.7.7"
  "@better-auth/cli": "1.4.21"
  "@better-auth/utils": "0.4.0"
  "@better-auth/telemetry": "1.7.7"
  next: "16.4.1"
  fast-uri: "^3.1.9"
  esbuild: "^0.28.1"
  axios: "1.15.0"
  handlebars: "4.7.10"
  fastify: "5.12.6"
  defu: "6.1.5"
  lodash: "4.18.1"
  flatted: "3.4.2"
  picomatch: "4.0.4"
  brace-expansion: "5.0.6"
  vite: "7.3.2"
  jsdom: "25.0.1"
  kysely: "0.28.17"
  postcss: "8.5.23"
  protocol-buffers-schema: "3.6.1"
  uuid@<11.1.1: ^11.1.1
  source-map: "^0.7.4"
  browserslist: "^4.28.7"
  find-my-way: "^9.7.0"
  nanoid@<3.3.18: "^3.3.18"
  deepmerge-ts: "^8.0.0"
  "@fastify/busboy": "^3.2.2"
  source-map-js: "^1.2.2"
  "@azure/msal-node": "^7.1.0"

peerDependencyRules:
  allowedVersions:
    react: "^19.0.0"
    react-dom: "^19.0.0"

minimumReleaseAgeExclude:
  - brace-expansion@5.0.6
  - uuid@11.1.1
  - '@next/bundle-analyzer@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - eslint-config-next@16.4.1

patchedDependencies:
  brace-expansion@5.0.6: patches/brace-expansion@5.0.6.patch
  flowbite-react@0.12.17: patches/flowbite-react@0.12.17.patch
