name: Mobile acceptance checks

on:
  pull_request:
    branches: [acceptance]
    paths:
      - "apps/frontend/src/server/mobile/**"
      - "apps/frontend/src/server/services/**"
      - "apps/frontend/src/app/api/mobile/**"
      - "apps/services/mobile-notification-service/**"
      - "apps/frontend/src/shared/lib/permissions-config.ts"
      - "packages/db/drizzle/mobile_*.sql"
      - ".github/workflows/mobile-acceptance.yml"
      - ".github/workflows/mobile-notifications-setup.yml"
      - "apps/mobile/**"

permissions:
  contents: read

jobs:
  mobile-policy-and-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Authentication and acceptance boundary tests
        run: bun test apps/mobile/tests/mobile-security.test.mjs
      - name: Mobile auth, activity administration, widget and preference tests
        run: bun test apps/mobile/tests/mobile-auth-flow.test.mjs apps/mobile/tests/mobile-admin*.test.mjs apps/mobile/tests/mobile-notification-preferences.test.mjs
      - name: APNs and notification worker tests
        run: node --test apps/services/mobile-notification-service/test/*.test.mjs
      - name: Acceptance setup safety tests
        run: python3 -m unittest discover -s apps/mobile/deployment -p 'test_*.py'
      - name: Worker lint
        run: bun run --filter=@salvemundi/mobile-notification-service lint
