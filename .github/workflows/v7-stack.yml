name: Deploy V7 Stack

on:
  workflow_dispatch:
    inputs:
      mobile_setup_action:
        description: 'Acceptance notification setup only (none keeps normal deployment)'
        type: choice
        options: [none, check, configure, migrate, start, test]
        default: none
      mobile_confirm_isolation:
        description: 'I verified acceptance and production use different databases'
        type: boolean
        default: false
      mobile_shared_database_pilot_ack:
        description: 'Explicit shared-DB single-account sandbox pilot; never migrate or claim isolation'
        type: boolean
        default: false
      mobile_test_user_ids:
        description: 'Explicit approved test-member UUIDs, comma separated (configure only)'
        type: string
        default: ''
      dev_database_action:
        description: 'Dev environment only (run on the dev branch): create tables / load synthetic seed data / show container logs'
        type: choice
        options: [none, init, seed, init-and-seed, app-logs, add-member]
        default: none
      dev_member_email:
        description: 'add-member only: your Microsoft email; becomes an active member and leader of the ICT and activities committees in dev'
        type: string
        default: ''
  push:
    branches:
      - main
      - acceptance
      - dev
    paths:
      - "apps/frontend/**"
      - "apps/services/finance-service/**"
      - "apps/services/azure-sync-service/**"
      - "apps/services/mail-service/**"
      - "apps/services/azure-management-service/**"
      - "apps/services/mcp-service/**"
      - "apps/wieisdemol/**"
      - "packages/**"
      - "docker-compose.yml"
      - ".github/workflows/v7-stack.yml"
  pull_request:
    branches:
      - main
      - acceptance
    paths:
      - "apps/frontend/**"
      - "apps/services/finance-service/**"
      - "apps/services/azure-sync-service/**"
      - "apps/services/mail-service/**"
      - "apps/services/azure-management-service/**"
      - "apps/services/mcp-service/**"
      - "apps/wieisdemol/**"
      - "packages/**"
      - "docker-compose.yml"
      - ".github/workflows/v7-stack.yml"

permissions:
  contents: read
  packages: write

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || (inputs.mobile_setup_action == 'none' && inputs.dev_database_action == 'none')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: |
          echo "Determining tag for ref ${{ github.ref_name }}"
          echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

  lint:
    needs: prepare
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@salvemundi/db build
      - run: pnpm --filter=@salvemundi/validations build
      - name: Verify mobile activity administration and widget permissions
        run: node --experimental-vm-modules --test apps/mobile/tests/mobile-admin*.test.mjs apps/mobile/tests/mobile-notification-preferences.test.mjs
      - run: pnpm type-check
      - run: pnpm -r lint
      - run: pnpm --filter=@salvemundi/mcp-service test

  build-frontend:
    needs: [prepare, lint]
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/salvemundi/v7-app:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ github.workflow }}-frontend
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-frontend
          labels: |
            environment=${{ needs.prepare.outputs.tag }}

  build-services:
    needs: [prepare, lint]
    name: Build Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [finance, azure-sync, mail, azure-management, mcp, wieisdemol]
        include:
          - service: finance
            file: apps/services/finance-service/Dockerfile
            image: v7-finance
          - service: azure-sync
            file: apps/services/azure-sync-service/Dockerfile
            image: v7-sync
          - service: mail
            file: apps/services/mail-service/Dockerfile
            image: v7-mail
          - service: azure-management
            file: apps/services/azure-management-service/Dockerfile
            image: v7-management
          - service: mcp
            file: apps/services/mcp-service/Dockerfile
            image: v7-mcp
          - service: wieisdemol
            file: apps/wieisdemol/Dockerfile
            image: v7-wieisdemol
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # The dev environment doesn't run the Wie is de Mol game, so its image isn't built there.
      - uses: docker/build-push-action@v6
        if: ${{ !(github.ref_name == 'dev' && matrix.service == 'wieisdemol') }}
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/salvemundi/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.service }}
          labels: |
            environment=${{ needs.prepare.outputs.tag }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [prepare, build-frontend, build-services]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mobile_setup_action == 'none' && inputs.dev_database_action == 'none')
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || (github.ref_name == 'dev' && 'Development' || 'Acceptance') }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect to NetBird VPN
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Wait for VPN routing to be ready
        run: |
          echo "Waiting for SSH port on ${{ secrets.VPN_IP }} to be reachable..."
          for i in {1..30}; do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.VPN_IP }}/22' >/dev/null 2>&1; then
              echo "VPS SSH port is reachable!"
              exit 0
            fi
            echo "VPS SSH port not reachable yet, waiting 2 seconds... ($i/30)"
            sleep 2
          done
          echo "Error: VPS SSH port remained unreachable after 60 seconds."
          exit 1

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Upload Docker Compose
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }}:/opt/salve-mundi-v7/docker-compose.yml

      # The dev environment has its own Postgres/Redis/Directus ("dev core"), separate from v7-core-*.
      - name: Start dev core (dev branch only)
        if: github.ref_name == 'dev'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} "mkdir -p /opt/salve-mundi-v7/dev-core"
          scp -i ~/.ssh/deploy_key infrastructure/dev-server/docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }}:/opt/salve-mundi-v7/dev-core/docker-compose.yml
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} bash << 'ENDSSH'
          set -e
          cd /opt/salve-mundi-v7/dev-core
          umask 077
          cat > .env.dev-core << 'EOF'
          VPN_IP="${{ secrets.VPN_IP }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DEV_DB_PORT="${{ vars.DEV_DB_PORT || '5433' }}"
          DEV_DIRECTUS_PORT="${{ vars.DEV_DIRECTUS_PORT || '8056' }}"
          REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
          DIRECTUS_KEY="${{ secrets.DIRECTUS_KEY }}"
          DIRECTUS_SECRET="${{ secrets.DIRECTUS_SECRET }}"
          DIRECTUS_STATIC_TOKEN="${{ secrets.DIRECTUS_STATIC_TOKEN }}"
          DIRECTUS_ADMIN_EMAIL="${{ secrets.DIRECTUS_ADMIN_EMAIL }}"
          DIRECTUS_ADMIN_PASSWORD="${{ secrets.DIRECTUS_ADMIN_PASSWORD }}"
          PUBLIC_URL="${{ vars.PUBLIC_URL }}"
          DIRECTUS_PUBLIC_URL="http://${{ secrets.VPN_IP }}:${{ vars.DEV_DIRECTUS_PORT || '8056' }}"
          EOF
          docker compose -p v7-dev-core --env-file .env.dev-core up -d --wait
          ENDSSH

      - name: Execute Deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} bash << 'ENDSSH'
          set -e
          cd /opt/salve-mundi-v7

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          ENV_NAME="acc"
          FRONTEND_PORT="3000"
          FINANCE_PORT="13001"
          SYNC_PORT="13002"
          MAIL_PORT="13003"
          MANAGEMENT_PORT="13004"
          MONITORING_PORT="13006"
          WIEISDEMOL_URL="https://acc-mol.salvemundi.nl"
          if [ "${{ needs.prepare.outputs.tag }}" = "dev" ]; then
            ENV_NAME="dev"
            FRONTEND_PORT="5000"
            FINANCE_PORT="23001"
            SYNC_PORT="23002"
            MAIL_PORT="23003"
            MANAGEMENT_PORT="23004"
            MONITORING_PORT="23006"
            WIEISDEMOL_URL="https://dev.salvemundi.nl"
          fi
          if [ "${{ needs.prepare.outputs.tag }}" = "main" ]; then
            ENV_NAME="prod"
            FRONTEND_PORT="4000"
            FINANCE_PORT="3001"
            SYNC_PORT="3002"
            MAIL_PORT="3003"
            MANAGEMENT_PORT="3004"
            MONITORING_PORT="3006"
            WIEISDEMOL_URL="https://mol.salvemundi.nl"
          fi

          echo "# Auto-generated V7 App Environment" > .env.${ENV_NAME}

          cat >> .env.${ENV_NAME} << 'EOF'
          MOLLIE_API_KEY="${{ secrets.MOLLIE_API_KEY }}"
          MOLLIE_WEBHOOK_SECRET="${{ secrets.MOLLIE_WEBHOOK_SECRET }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_PORT="${{ secrets.DB_PORT }}"
          DIRECTUS_KEY="${{ secrets.DIRECTUS_KEY }}"
          DIRECTUS_SECRET="${{ secrets.DIRECTUS_SECRET }}"
          INTERNAL_SERVICE_TOKEN="${{ secrets.INTERNAL_SERVICE_TOKEN }}"
          AZURE_WEBSITEV7_TENANT_ID="${{ secrets.AZURE_WEBSITEV7_TENANT_ID }}"
          AZURE_WEBSITEV7_SYNC_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_SYNC_CLIENT_ID }}"
          AZURE_WEBSITEV7_SYNC_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_SYNC_CLIENT_SECRET }}"
          AZURE_WEBSITEV7_MAIL_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_MAIL_CLIENT_ID }}"
          AZURE_WEBSITEV7_MAIL_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_MAIL_CLIENT_SECRET }}"
          AZURE_MAIL_SENDER="${{ secrets.AZURE_MAIL_SENDER }}"
          AZURE_WEBSITEV7_AUTH_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_AUTH_CLIENT_ID }}"
          AZURE_WEBSITEV7_AUTH_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_AUTH_CLIENT_SECRET }}"
          AZURE_WEBSITEV7_DIRECTUS_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_DIRECTUS_CLIENT_ID }}"
          AZURE_WEBSITEV7_DIRECTUS_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_DIRECTUS_CLIENT_SECRET }}"
          BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}"
          DIRECTUS_STATIC_TOKEN="${{ secrets.DIRECTUS_STATIC_TOKEN }}"
          REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
          AZURE_WEBSITEV7_PROVISIONING_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_PROVISIONING_CLIENT_ID }}"
          AZURE_WEBSITEV7_PROVISIONING_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_PROVISIONING_CLIENT_SECRET }}"
          VPN_IP="${{ secrets.VPN_IP }}"
          KUMA_ADMIN_USER="${{ secrets.KUMA_ADMIN_USER }}"
          KUMA_ADMIN_PASSWORD="${{ secrets.KUMA_ADMIN_PASSWORD }}"
          DISCORD_MONITORING_WEBHOOK_URL="${{ secrets.DISCORD_MONITORING_WEBHOOK_URL }}"
          MC_WHITELIST_WEBHOOK_URL="${{ secrets.MC_WHITELIST_WEBHOOK_URL }}"
          MC_WHITELIST_WEBHOOK_TOKEN="${{ secrets.MC_WHITELIST_WEBHOOK_TOKEN }}"
          GOOGLE_SERVICE_ACCOUNT_EMAIL="${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}"
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY="${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}"
          EOF

          echo "IMAGE_TAG=${{ needs.prepare.outputs.tag }}" >> .env.${ENV_NAME}
          echo "PUBLIC_URL=${{ vars.PUBLIC_URL }}" >> .env.${ENV_NAME}
          echo "BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}" >> .env.${ENV_NAME}
          if [ "${ENV_NAME}" = "prod" ]; then
            echo "BETTER_AUTH_TRUSTED_ORIGINS=https://salvemundi.nl,https://preprod.salvemundi.nl" >> .env.${ENV_NAME}
          elif [ "${ENV_NAME}" = "dev" ]; then
            echo "BETTER_AUTH_TRUSTED_ORIGINS=https://dev.salvemundi.nl" >> .env.${ENV_NAME}
          else
            echo "BETTER_AUTH_TRUSTED_ORIGINS=https://acc.salvemundi.nl" >> .env.${ENV_NAME}
          fi
          echo "FRONTEND_PORT=${FRONTEND_PORT}" >> .env.${ENV_NAME}
          echo "FINANCE_PORT=${FINANCE_PORT}" >> .env.${ENV_NAME}
          echo "MONITORING_PORT=${MONITORING_PORT}" >> .env.${ENV_NAME}
          echo "ENV_NAME=${ENV_NAME}" >> .env.${ENV_NAME}
          # The native app backend runs only in acceptance and dev, even if a production variable is set.
          if [ "$ENV_NAME" = "acc" ] || [ "$ENV_NAME" = "dev" ]; then
            echo "MOBILE_API_ENABLED=${{ vars.MOBILE_API_ENABLED || 'false' }}" >> .env.${ENV_NAME}
            echo "MOBILE_APNS_ALLOW_PRODUCTION=${{ vars.MOBILE_APNS_ALLOW_PRODUCTION || 'false' }}" >> .env.${ENV_NAME}
            echo "MOBILE_APPLE_TEAM_ID=${{ vars.MOBILE_APPLE_TEAM_ID }}" >> .env.${ENV_NAME}
            # Android App Links (/.well-known/assetlinks.json); public signing-cert fingerprints, not secrets.
            echo "MOBILE_ANDROID_PACKAGE_NAME=${{ vars.MOBILE_ANDROID_PACKAGE_NAME || 'nl.salvemundi.android' }}" >> .env.${ENV_NAME}
            echo "MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS=${{ vars.MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS }}" >> .env.${ENV_NAME}
          else
            echo "MOBILE_API_ENABLED=false" >> .env.${ENV_NAME}
          fi
          echo "WIEISDEMOL_URL=${WIEISDEMOL_URL}" >> .env.${ENV_NAME}

          echo "HOSTNAME=0.0.0.0" >> .env.${ENV_NAME}

          if [ "$ENV_NAME" = "acc" ] || [ "$ENV_NAME" = "dev" ]; then
            echo "MOLLIE_TEST_ISSUER=lsvb_test" >> .env.${ENV_NAME}
            echo "[DEPLOY] Mollie Test Simulator ingeschakeld voor Acceptance"
          fi

          echo "SYNC_PORT=${SYNC_PORT}" >> .env.${ENV_NAME}
          echo "MAIL_PORT=${MAIL_PORT}" >> .env.${ENV_NAME}
          echo "MANAGEMENT_PORT=${MANAGEMENT_PORT}" >> .env.${ENV_NAME}
          echo "COMPOSE_PROJECT_NAME=v7-${ENV_NAME}" >> .env.${ENV_NAME}
          echo "TRUST_PROXY=true" >> .env.${ENV_NAME}
          CORE_PREFIX="v7-core"
          if [ "$ENV_NAME" = "dev" ]; then
            CORE_PREFIX="v7-dev"
          fi
          echo "INTERNAL_DIRECTUS_URL=http://${CORE_PREFIX}-directus:8055" >> .env.${ENV_NAME}
          echo "AZURE_SYNC_SERVICE_URL=http://v7-${ENV_NAME}-sync:3002" >> .env.${ENV_NAME}
          echo "AZURE_MANAGEMENT_SERVICE_URL=http://v7-${ENV_NAME}-management:3004" >> .env.${ENV_NAME}
          echo "MAIL_SERVICE_URL=http://v7-${ENV_NAME}-mail:3003" >> .env.${ENV_NAME}
          echo "NEXT_APP_INTERNAL_URL=http://v7-${ENV_NAME}-app:3000" >> .env.${ENV_NAME}
          echo "FRONTEND_SERVICE_URL=http://v7-${ENV_NAME}-app:3000" >> .env.${ENV_NAME}
          echo "FINANCE_SERVICE_URL=http://v7-${ENV_NAME}-finance:3001" >> .env.${ENV_NAME}
          echo "KUMA_URL=http://127.0.0.1:${MONITORING_PORT}" >> .env.${ENV_NAME}
          echo "DB_HOST=${CORE_PREFIX}-db" >> .env.${ENV_NAME}
          echo "REDIS_HOST=${CORE_PREFIX}-redis" >> .env.${ENV_NAME}
          if [ "$ENV_NAME" = "dev" ]; then
            # Inside the shared Docker network the dev database listens on the default port.
            sed -i 's/^DB_PORT=.*/DB_PORT="5432"/' .env.${ENV_NAME}
          fi
          echo "REDIS_PORT=6379" >> .env.${ENV_NAME}

          REDIS_DB_SUFFIX=""
          if [ "$ENV_NAME" = "acc" ]; then
            REDIS_DB_SUFFIX="/1"
          fi

          if [ ! -z "${{ secrets.REDIS_PASSWORD }}" ]; then
            echo "REDIS_URL=redis://default:${{ secrets.REDIS_PASSWORD }}@${CORE_PREFIX}-redis:6379${REDIS_DB_SUFFIX}" >> .env.${ENV_NAME}
          else
            echo "REDIS_URL=redis://${CORE_PREFIX}-redis:6379${REDIS_DB_SUFFIX}" >> .env.${ENV_NAME}
          fi

          # MCP-server (alleen-lezen Samu Bijbel) is opt-in per GitHub Environment (vars.MCP_ENABLED=true).
          # Alle MCP_* waarden komen uit de Environment-eigen secrets/vars; er zijn bewust geen defaults,
          # zodat Acceptance nooit productiecredentials of de productie-SharePointsite gebruikt.
          if [ "${{ vars.MCP_ENABLED }}" = "true" ]; then
            echo "COMPOSE_PROFILES=mcp" >> .env.${ENV_NAME}
            echo "MCP_PUBLIC_URL=${{ vars.MCP_PUBLIC_URL }}" >> .env.${ENV_NAME}
            echo "MCP_ENTRA_TENANT_ID=${{ secrets.AZURE_WEBSITEV7_TENANT_ID }}" >> .env.${ENV_NAME}
            echo "MCP_ENTRA_CLIENT_ID=${{ vars.MCP_ENTRA_CLIENT_ID }}" >> .env.${ENV_NAME}
            echo "MCP_ENTRA_CLIENT_SECRET=${{ secrets.MCP_ENTRA_CLIENT_SECRET }}" >> .env.${ENV_NAME}
            echo "MCP_SHAREPOINT_SITE_ID=${{ vars.MCP_SHAREPOINT_SITE_ID }}" >> .env.${ENV_NAME}
            echo "MCP_ALLOWED_PATH_PREFIX=${{ vars.MCP_ALLOWED_PATH_PREFIX || '/' }}" >> .env.${ENV_NAME}
            echo "MCP_ALLOWED_ORIGINS=${{ vars.MCP_ALLOWED_ORIGINS }}" >> .env.${ENV_NAME}
            echo "MCP_FILES_PATH=${{ vars.MCP_FILES_PATH || '/Sjablonen' }}" >> .env.${ENV_NAME}
            echo "MCP_MAX_DOWNLOAD_BYTES=${{ vars.MCP_MAX_DOWNLOAD_BYTES || '262144' }}" >> .env.${ENV_NAME}
          fi

          if [ "$ENV_NAME" = "dev" ]; then
            # Dev runs without the Wie is de Mol game; the cleanup below removes its container.
            ACTIVE_SERVICES=$(docker compose --env-file .env.${ENV_NAME} config --services | grep -vxF wieisdemol)
            docker compose --env-file .env.${ENV_NAME} pull $ACTIVE_SERVICES
            docker compose --env-file .env.${ENV_NAME} up -d $ACTIVE_SERVICES
          else
            docker compose --env-file .env.${ENV_NAME} pull
            docker compose --env-file .env.${ENV_NAME} up -d
            ACTIVE_SERVICES=$(docker compose --env-file .env.${ENV_NAME} config --services)
          fi
          # Clean up removed services, preserving the independently maintained production game.
          for CONTAINER_ID in $(docker ps -aq --filter "label=com.docker.compose.project=v7-${ENV_NAME}"); do
            CONTAINER_NAME=$(docker inspect --format '{{.Name}}' "$CONTAINER_ID")
            if [ "$CONTAINER_NAME" = "/v7-prod-wieisdemol" ]; then
              continue
            fi
            SERVICE_NAME=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$CONTAINER_ID")
            ONE_OFF=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.oneoff"}}' "$CONTAINER_ID")
            if [ "$ONE_OFF" != "True" ] && ! printf '%s\n' "$ACTIVE_SERVICES" | grep -Fxq -- "$SERVICE_NAME"; then
              docker rm -f "$CONTAINER_ID"
            fi
          done
          docker image prune -af
          ENDSSH




  mobile-notifications-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.mobile_setup_action != 'none' && github.ref == 'refs/heads/acceptance'
    uses: ./.github/workflows/mobile-notifications-setup.yml
    with:
      action: ${{ inputs.mobile_setup_action }}
      confirm_isolation: ${{ inputs.mobile_confirm_isolation }}
      test_user_ids: ${{ inputs.mobile_test_user_ids }}
      shared_database_pilot_ack: ${{ inputs.mobile_shared_database_pilot_ack }}
    secrets: inherit

  # One-off setup of the dev database (dev branch, manual run). The runner joins the VPN and runs the repository's
  # own local-dev scripts against the dev core; acceptance/production databases are never addressed.
  dev-database:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["init","seed","init-and-seed"]'), inputs.dev_database_action) && github.ref == 'refs/heads/dev'
    name: Dev database (${{ inputs.dev_database_action }})
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@11.8.0
      - run: pnpm install --frozen-lockfile --filter @salvemundi/db...
      - name: Connect to NetBird VPN
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
      - name: Wait for the dev database
        run: |
          for i in {1..30}; do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.VPN_IP }}/${{ vars.DEV_DB_PORT || '5433' }}' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Dev database not reachable over the VPN. Deploy the dev branch first."; exit 1
      # Credentials are passed as separate values; local-env.mjs URL-encodes them (passwords may contain any character).
      - name: Create tables
        if: inputs.dev_database_action == 'init' || inputs.dev_database_action == 'init-and-seed'
        env:
          RAW_HOST: ${{ secrets.VPN_IP }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ vars.DEV_DB_PORT || '5433' }}
        run: |
          export DB_HOST="$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')"
          pnpm dev:db:init
          # Mobile app tables (manual migrations, idempotent).
          sudo apt-get install -y -qq postgresql-client >/dev/null
          export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" PGDATABASE="$DB_NAME"
          psql -v ON_ERROR_STOP=1 -f packages/db/drizzle/mobile_notifications.sql
          psql -v ON_ERROR_STOP=1 -f packages/db/drizzle/mobile_notifications_android.sql
      - name: Load synthetic seed data
        if: inputs.dev_database_action == 'seed' || inputs.dev_database_action == 'init-and-seed'
        env:
          RAW_HOST: ${{ secrets.VPN_IP }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ vars.DEV_DB_PORT || '5433' }}
          DIRECTUS_PORT: ${{ vars.DEV_DIRECTUS_PORT || '8056' }}
          DIRECTUS_STATIC_TOKEN: ${{ secrets.DIRECTUS_STATIC_TOKEN }}
        run: |
          export DB_HOST="$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')"
          export INTERNAL_DIRECTUS_URL="http://${DB_HOST}:${DIRECTUS_PORT}"
          pnpm dev:db:seed
      # Better Auth caches a schema check result per process, and the site caches data: restart the dev app
      # containers so they see the new tables and seed data.
      - name: Restart dev app containers
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} \
            'docker restart v7-dev-app v7-dev-finance v7-dev-mail v7-dev-management v7-dev-sync'

  # Read-only troubleshooting for the dev environment: recent logs of the v7-dev-* containers.
  dev-logs:
    if: github.event_name == 'workflow_dispatch' && inputs.dev_database_action == 'app-logs' && github.ref == 'refs/heads/dev'
    name: Dev container logs
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - name: Connect to NetBird VPN
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      - name: Show logs
        run: |
          for i in {1..30}; do timeout 1 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.VPN_IP }}/22' >/dev/null 2>&1 && break; sleep 2; done
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} bash << 'ENDSSH'
          docker ps -a --filter "name=v7-dev-" --format 'table {{.Names}}\t{{.Status}}'
          for c in v7-dev-app v7-dev-finance v7-dev-directus; do
            echo "===== $c (last 150 lines)"
            docker logs --tail 150 "$c" 2>&1 || true
          done
          echo "===== dev database (read-only)"
          docker exec -i v7-dev-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' << 'SQL' || true
          select 'database: ' || current_database() || ', user: ' || current_user;
          select 'databases: ' || string_agg(datname, ', ') from pg_database where not datistemplate;
          select 'public tables: ' || count(*) from information_schema.tables where table_schema = 'public';
          select 'auth tables: ' || coalesce(string_agg(table_schema || '.' || table_name, ', '), 'none')
            from information_schema.tables where table_name in ('auth_sessions', 'auth_accounts', 'verification', 'events', 'directus_users');
          select 'entra_id column: ' || coalesce(string_agg(table_schema || '.' || table_name, ', '), 'none')
            from information_schema.columns where column_name = 'entra_id';
          SQL
          ENDSSH

  # Dev has no Azure sync, so members do not exist until added. Website login links to an existing member by email.
  dev-member:
    if: github.event_name == 'workflow_dispatch' && inputs.dev_database_action == 'add-member' && github.ref == 'refs/heads/dev'
    name: Dev member
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - name: Connect to NetBird VPN
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
      - name: Add member and committee rights
        env:
          RAW_HOST: ${{ secrets.VPN_IP }}
          PGPORT: ${{ vars.DEV_DB_PORT || '5433' }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          PGDATABASE: ${{ secrets.DB_NAME }}
          MEMBER_EMAIL: ${{ inputs.dev_member_email }}
        run: |
          EMAIL="$(printf '%s' "$MEMBER_EMAIL" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$EMAIL" | grep -Eq '^[^@]+@[^@]+\.[^@]+$'; then echo "Set dev_member_email to a valid email address."; exit 1; fi
          export PGHOST="$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')"
          sudo apt-get install -y -qq postgresql-client >/dev/null
          # Committee group ids are the public ids from apps/frontend/src/shared/lib/permissions.ts (COMMITTEES).
          psql -v ON_ERROR_STOP=1 -v email="$EMAIL" << 'SQL'
          BEGIN;
          UPDATE committees SET azure_group_id = 'a4aeb401-882d-4e1e-90ee-106b7fdb23cc' WHERE name = 'ICT-commissie' AND azure_group_id IS NULL;
          UPDATE committees SET azure_group_id = 'd4686b83-4679-46ed-9fd8-c6ff3c6a265f' WHERE name = 'Activiteitencommissie' AND azure_group_id IS NULL;
          INSERT INTO directus_users (id, email, first_name, last_name, name, status, membership_status, membership_expiry, emailverified)
            SELECT gen_random_uuid(), :'email', split_part(:'email', '@', 1), '', split_part(:'email', '@', 1), 'active', 'active', (now() + interval '1 year')::date, true
            WHERE NOT EXISTS (SELECT 1 FROM directus_users WHERE lower(email) = :'email');
          UPDATE directus_users SET status = 'active', membership_status = 'active', membership_expiry = (now() + interval '1 year')::date
            WHERE lower(email) = :'email';
          INSERT INTO committee_members (committee_id, user_id, is_leader, is_visible)
            SELECT c.id, u.id, true, true FROM committees c JOIN directus_users u ON lower(u.email) = :'email'
            WHERE c.name IN ('ICT-commissie', 'Activiteitencommissie')
              AND NOT EXISTS (SELECT 1 FROM committee_members m WHERE m.committee_id = c.id AND m.user_id = u.id);
          COMMIT;
          SELECT 'member: ' || email || ' (' || membership_status || ')' FROM directus_users WHERE lower(email) = :'email';
          SELECT 'committee: ' || c.name || ' (leader)' FROM committee_members m JOIN committees c ON c.id = m.committee_id
            JOIN directus_users u ON u.id = m.user_id WHERE lower(u.email) = :'email';
          SQL
