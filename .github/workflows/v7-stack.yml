name: Deploy V7 Stack

on:
  workflow_dispatch:
    inputs:
      mobile_setup_action:
        description: 'Acceptance notification setup only (none keeps normal deployment)'
        type: choice
        options: [none, check, configure, migrate, start, test]
        default: none
      mobile_confirm_isolation:
        description: 'I verified acceptance and production use different databases'
        type: boolean
        default: false
      mobile_shared_database_pilot_ack:
        description: 'Explicit shared-DB single-account sandbox pilot; never migrate or claim isolation'
        type: boolean
        default: false
      mobile_test_user_ids:
        description: 'Explicit approved test-member UUIDs, comma separated (configure only)'
        type: string
        default: ''
      dev_notifications_action:
        description: 'Dev Android notifications only'
        type: choice
        options: [none, migrate, check, start, stop]
        default: none
      dev_wrapped_testdata:
        description: 'Dev only: Samu Wrapped test data (seed = recreate for the email below, cleanup = remove all)'
        type: choice
        options: [none, seed, cleanup]
        default: none
      dev_wrapped_email:
        description: 'Wrapped test data only: email of your dev account'
        type: string
        default: ''
  push:
    branches:
      - main
      - acceptance
      - dev
    paths:
      - "apps/frontend/**"
      - "apps/services/finance-service/**"
      - "apps/services/azure-sync-service/**"
      - "apps/services/mail-service/**"
      - "apps/services/azure-management-service/**"
      - "apps/services/mcp-service/**"
      - "apps/wieisdemol/**"
      - "packages/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".github/workflows/v7-stack.yml"
      - "infrastructure/dev-server/docker-compose.yml"
  pull_request:
    branches:
      - main
      - acceptance
    paths:
      - "apps/frontend/**"
      - "apps/services/finance-service/**"
      - "apps/services/azure-sync-service/**"
      - "apps/services/mail-service/**"
      - "apps/services/azure-management-service/**"
      - "apps/services/mcp-service/**"
      - "apps/wieisdemol/**"
      - "packages/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".github/workflows/v7-stack.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (inputs.mobile_setup_action == 'none' && inputs.dev_notifications_action == 'none' && inputs.dev_wrapped_testdata == 'none')) && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || (inputs.mobile_setup_action == 'none' && inputs.dev_notifications_action == 'none' && inputs.dev_wrapped_testdata == 'none')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      images: ${{ steps.plan.outputs.images }}
      compose_override: ${{ steps.plan.outputs.compose_override }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = refs/heads/dev ]; then
            git ls-tree -rz HEAD > "$RUNNER_TEMP/deploy-tree"
          fi
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');

          const components = [
            ['frontend', 'frontend', 'apps/frontend', 'v7-app'],
            ['finance', 'finance-service', 'apps/services/finance-service', 'v7-finance'],
            ['azure-sync', 'sync-service', 'apps/services/azure-sync-service', 'v7-sync'],
            ['mail', 'mail-service', 'apps/services/mail-service', 'v7-mail'],
            ['azure-management', 'management-service', 'apps/services/azure-management-service', 'v7-management'],
            ['mcp', 'mcp-service', 'apps/services/mcp-service', 'v7-mcp'],
            ['wieisdemol', 'wieisdemol', 'apps/wieisdemol', 'v7-wieisdemol'],
          ];
          const tag = process.env.REF_NAME.replaceAll('/', '-');
          const selective = process.env.REF === 'refs/heads/dev';
          const sharedInputs = [
            '.dockerignore', '.npmrc', 'package.json', 'pnpm-lock.yaml',
            'pnpm-workspace.yaml', 'patches', 'packages',
            ...components.filter(([name]) => name !== 'wieisdemol')
              .map(([, , directory]) => directory + '/package.json'),
          ];
          const tree = selective
            ? readFileSync(process.env.RUNNER_TEMP + '/deploy-tree', 'utf8').split('\0').filter(Boolean)
            : [];
          const services = {};
          const include = [];
          for (const [name, service, directory, image] of components) {
            if (selective && name === 'wieisdemol') continue;

            let imageTag = tag;
            if (selective) {
              // Git tree entries cover edits, additions, removals and executable-bit changes.
              const paths = [directory, ...sharedInputs];
              const inputs = tree.filter(entry => {
                const path = entry.slice(entry.indexOf('\t') + 1);
                return paths.some(input => path === input || path.startsWith(input + '/'));
              });
              const hash = createHash('sha256').update(inputs.join('\0')).digest('hex');
              // Bump the tag version to refresh unchanged builds against newer base images.
              imageTag = 'dev-v1-' + hash;
            }
            const imageRef = 'ghcr.io/salvemundi/' + image + ':' + imageTag;
            include.push({ name, file: directory + '/Dockerfile', image: imageRef });
            services[service] = { image: imageRef };
          }
          console.log('tag=' + tag);
          console.log('images=' + JSON.stringify({ include }));
          console.log('compose_override=' + JSON.stringify({ services }));
          NODE

  lint:
    needs: prepare
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@11.8.0
      - name: Locate pnpm store
        if: github.ref == 'refs/heads/dev'
        id: pnpm-store
        run: |
          store_path=$(pnpm store path)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: github.ref == 'refs/heads/dev'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-11-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@salvemundi/db build
      - run: pnpm --filter=@salvemundi/validations build
      - name: Verify mobile activity administration and widget permissions
        run: node --experimental-vm-modules --test apps/mobile/tests/mobile-admin*.test.mjs apps/mobile/tests/mobile-notification-preferences.test.mjs
      - run: pnpm type-check
      - run: pnpm -r lint
      - run: pnpm --filter=@salvemundi/mcp-service test

  build-images:
    needs: [prepare, lint]
    name: Build image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing dev image
        if: github.ref == 'refs/heads/dev'
        id: lookup
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null; then
            echo "Reusing $IMAGE"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.lookup.outputs.hit != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.lookup.outputs.hit != 'true'
      - uses: docker/build-push-action@v6
        if: steps.lookup.outputs.hit != 'true'
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.name }}
          labels: |
            environment=${{ needs.prepare.outputs.tag }}
      - name: Report image result
        env:
          IMAGE: ${{ matrix.image }}
          REUSED: ${{ steps.lookup.outputs.hit }}
        run: |
          result=Built
          if [ "$REUSED" = true ]; then
            result=Reused
          fi
          printf '%s — `%s`\n' "$result" "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [prepare, build-images]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mobile_setup_action == 'none' && inputs.dev_notifications_action == 'none' && inputs.dev_wrapped_testdata == 'none'))
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || (github.ref_name == 'dev' && 'Development' || 'Acceptance') }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect to NetBird VPN
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Wait for VPN routing to be ready
        run: |
          echo "Waiting for SSH port on ${{ secrets.VPN_IP }} to be reachable..."
          for i in {1..30}; do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.VPN_IP }}/22' >/dev/null 2>&1; then
              echo "VPS SSH port is reachable!"
              exit 0
            fi
            echo "VPS SSH port not reachable yet, waiting 2 seconds... ($i/30)"
            sleep 2
          done
          echo "Error: VPS SSH port remained unreachable after 60 seconds."
          exit 1

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Upload dev Docker Compose
        if: github.ref == 'refs/heads/dev'
        env:
          COMPOSE_OVERRIDE: ${{ needs.prepare.outputs.compose_override }}
        run: |
          cp docker-compose.yml docker-compose.dev.yml
          printf '%s\n' "$COMPOSE_OVERRIDE" > docker-compose.dev-images.yml
          scp -i ~/.ssh/deploy_key docker-compose.dev.yml docker-compose.dev-images.yml ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }}:/opt/salve-mundi-v7/

      - name: Upload Docker Compose
        if: github.ref != 'refs/heads/dev'
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }}:/opt/salve-mundi-v7/docker-compose.yml

      # The dev environment has its own Postgres/Redis/Directus ("dev core"), separate from v7-core-*.
      - name: Start dev core (dev branch only)
        if: github.ref_name == 'dev'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} "mkdir -p /opt/salve-mundi-v7/dev-core"
          scp -i ~/.ssh/deploy_key infrastructure/dev-server/docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }}:/opt/salve-mundi-v7/dev-core/docker-compose.yml
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} bash << 'ENDSSH'
          set -e
          cd /opt/salve-mundi-v7/dev-core
          umask 077
          cat > .env.dev-core << 'EOF'
          VPN_IP="${{ secrets.VPN_IP }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DEV_DB_PORT="${{ vars.DEV_DB_PORT || '5433' }}"
          DEV_DIRECTUS_PORT="${{ vars.DEV_DIRECTUS_PORT || '8056' }}"
          REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
          DIRECTUS_KEY="${{ secrets.DIRECTUS_KEY }}"
          DIRECTUS_SECRET="${{ secrets.DIRECTUS_SECRET }}"
          DIRECTUS_STATIC_TOKEN="${{ secrets.DIRECTUS_STATIC_TOKEN }}"
          DIRECTUS_ADMIN_EMAIL="${{ secrets.DIRECTUS_ADMIN_EMAIL }}"
          DIRECTUS_ADMIN_PASSWORD="${{ secrets.DIRECTUS_ADMIN_PASSWORD }}"
          PUBLIC_URL="${{ vars.PUBLIC_URL }}"
          DIRECTUS_PUBLIC_URL="http://${{ secrets.VPN_IP }}:${{ vars.DEV_DIRECTUS_PORT || '8056' }}"
          EOF
          docker compose -p v7-dev-core --env-file .env.dev-core up -d --wait
          ENDSSH

      - name: Execute Deployment
        shell: bash
        run: |
          deploy_log="$RUNNER_TEMP/deploy.log"
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} bash << 'ENDSSH' | tee "$deploy_log"
          set -e
          cd /opt/salve-mundi-v7

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          ENV_NAME="acc"
          FRONTEND_PORT="3000"
          FINANCE_PORT="13001"
          SYNC_PORT="13002"
          MAIL_PORT="13003"
          MANAGEMENT_PORT="13004"
          MONITORING_PORT="13006"
          WIEISDEMOL_URL="https://acc-mol.salvemundi.nl"
          if [ "${{ needs.prepare.outputs.tag }}" = "dev" ]; then
            ENV_NAME="dev"
            FRONTEND_PORT="5000"
            FINANCE_PORT="23001"
            SYNC_PORT="23002"
            MAIL_PORT="23003"
            MANAGEMENT_PORT="23004"
            MONITORING_PORT="23006"
            WIEISDEMOL_URL="https://dev.salvemundi.nl"
          fi
          if [ "${{ needs.prepare.outputs.tag }}" = "main" ]; then
            ENV_NAME="prod"
            FRONTEND_PORT="4000"
            FINANCE_PORT="3001"
            SYNC_PORT="3002"
            MAIL_PORT="3003"
            MANAGEMENT_PORT="3004"
            MONITORING_PORT="3006"
            WIEISDEMOL_URL="https://mol.salvemundi.nl"
          fi

          echo "# Auto-generated V7 App Environment" > .env.${ENV_NAME}

          cat >> .env.${ENV_NAME} << 'EOF'
          MOLLIE_API_KEY="${{ secrets.MOLLIE_API_KEY }}"
          MOLLIE_WEBHOOK_SECRET="${{ secrets.MOLLIE_WEBHOOK_SECRET }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_PORT="${{ secrets.DB_PORT }}"
          DIRECTUS_KEY="${{ secrets.DIRECTUS_KEY }}"
          DIRECTUS_SECRET="${{ secrets.DIRECTUS_SECRET }}"
          INTERNAL_SERVICE_TOKEN="${{ secrets.INTERNAL_SERVICE_TOKEN }}"
          AZURE_WEBSITEV7_TENANT_ID="${{ secrets.AZURE_WEBSITEV7_TENANT_ID }}"
          AZURE_WEBSITEV7_SYNC_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_SYNC_CLIENT_ID }}"
          AZURE_WEBSITEV7_SYNC_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_SYNC_CLIENT_SECRET }}"
          AZURE_WEBSITEV7_MAIL_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_MAIL_CLIENT_ID }}"
          AZURE_WEBSITEV7_MAIL_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_MAIL_CLIENT_SECRET }}"
          AZURE_MAIL_SENDER="${{ secrets.AZURE_MAIL_SENDER }}"
          AZURE_WEBSITEV7_AUTH_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_AUTH_CLIENT_ID }}"
          AZURE_WEBSITEV7_AUTH_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_AUTH_CLIENT_SECRET }}"
          AZURE_WEBSITEV7_DIRECTUS_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_DIRECTUS_CLIENT_ID }}"
          AZURE_WEBSITEV7_DIRECTUS_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_DIRECTUS_CLIENT_SECRET }}"
          BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}"
          DIRECTUS_STATIC_TOKEN="${{ secrets.DIRECTUS_STATIC_TOKEN }}"
          REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
          AZURE_WEBSITEV7_PROVISIONING_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_PROVISIONING_CLIENT_ID }}"
          AZURE_WEBSITEV7_PROVISIONING_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_PROVISIONING_CLIENT_SECRET }}"
          VPN_IP="${{ secrets.VPN_IP }}"
          KUMA_ADMIN_USER="${{ secrets.KUMA_ADMIN_USER }}"
          KUMA_ADMIN_PASSWORD="${{ secrets.KUMA_ADMIN_PASSWORD }}"
          DISCORD_MONITORING_WEBHOOK_URL="${{ secrets.DISCORD_MONITORING_WEBHOOK_URL }}"
          MC_WHITELIST_WEBHOOK_URL="${{ secrets.MC_WHITELIST_WEBHOOK_URL }}"
          MC_WHITELIST_WEBHOOK_TOKEN="${{ secrets.MC_WHITELIST_WEBHOOK_TOKEN }}"
          GOOGLE_SERVICE_ACCOUNT_EMAIL="${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}"
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY="${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}"
          EOF

          echo "IMAGE_TAG=${{ needs.prepare.outputs.tag }}" >> .env.${ENV_NAME}
          echo "PUBLIC_URL=${{ vars.PUBLIC_URL }}" >> .env.${ENV_NAME}
          echo "BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}" >> .env.${ENV_NAME}
          if [ "${ENV_NAME}" = "prod" ]; then
            echo "BETTER_AUTH_TRUSTED_ORIGINS=https://salvemundi.nl,https://preprod.salvemundi.nl" >> .env.${ENV_NAME}
          elif [ "${ENV_NAME}" = "dev" ]; then
            echo "BETTER_AUTH_TRUSTED_ORIGINS=https://dev.salvemundi.nl" >> .env.${ENV_NAME}
          else
            echo "BETTER_AUTH_TRUSTED_ORIGINS=https://acc.salvemundi.nl" >> .env.${ENV_NAME}
          fi
          echo "FRONTEND_PORT=${FRONTEND_PORT}" >> .env.${ENV_NAME}
          echo "FINANCE_PORT=${FINANCE_PORT}" >> .env.${ENV_NAME}
          echo "MONITORING_PORT=${MONITORING_PORT}" >> .env.${ENV_NAME}
          echo "ENV_NAME=${ENV_NAME}" >> .env.${ENV_NAME}
          # The native app backend runs only in acceptance and dev, even if a production variable is set.
          if [ "$ENV_NAME" = "acc" ] || [ "$ENV_NAME" = "dev" ]; then
            echo "MOBILE_API_ENABLED=${{ vars.MOBILE_API_ENABLED || 'false' }}" >> .env.${ENV_NAME}
            echo "MOBILE_APNS_ALLOW_PRODUCTION=${{ vars.MOBILE_APNS_ALLOW_PRODUCTION || 'false' }}" >> .env.${ENV_NAME}
            echo "MOBILE_APPLE_TEAM_ID=${{ vars.MOBILE_APPLE_TEAM_ID }}" >> .env.${ENV_NAME}
            # Android App Links (/.well-known/assetlinks.json); public signing-cert fingerprints, not secrets.
            echo "MOBILE_ANDROID_PACKAGE_NAME=${{ vars.MOBILE_ANDROID_PACKAGE_NAME || 'nl.salvemundi.android' }}" >> .env.${ENV_NAME}
            echo "MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS=${{ vars.MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS }}" >> .env.${ENV_NAME}
          else
            echo "MOBILE_API_ENABLED=false" >> .env.${ENV_NAME}
          fi
          echo "WIEISDEMOL_URL=${WIEISDEMOL_URL}" >> .env.${ENV_NAME}

          echo "HOSTNAME=0.0.0.0" >> .env.${ENV_NAME}

          if [ "$ENV_NAME" = "acc" ] || [ "$ENV_NAME" = "dev" ]; then
            echo "MOLLIE_TEST_ISSUER=lsvb_test" >> .env.${ENV_NAME}
            echo "[DEPLOY] Mollie Test Simulator ingeschakeld voor Acceptance"
          fi

          echo "SYNC_PORT=${SYNC_PORT}" >> .env.${ENV_NAME}
          echo "MAIL_PORT=${MAIL_PORT}" >> .env.${ENV_NAME}
          echo "MANAGEMENT_PORT=${MANAGEMENT_PORT}" >> .env.${ENV_NAME}
          echo "COMPOSE_PROJECT_NAME=v7-${ENV_NAME}" >> .env.${ENV_NAME}
          echo "TRUST_PROXY=true" >> .env.${ENV_NAME}
          CORE_PREFIX="v7-core"
          if [ "$ENV_NAME" = "dev" ]; then
            CORE_PREFIX="v7-dev"
          fi
          echo "INTERNAL_DIRECTUS_URL=http://${CORE_PREFIX}-directus:8055" >> .env.${ENV_NAME}
          echo "AZURE_SYNC_SERVICE_URL=http://v7-${ENV_NAME}-sync:3002" >> .env.${ENV_NAME}
          echo "AZURE_MANAGEMENT_SERVICE_URL=http://v7-${ENV_NAME}-management:3004" >> .env.${ENV_NAME}
          echo "MAIL_SERVICE_URL=http://v7-${ENV_NAME}-mail:3003" >> .env.${ENV_NAME}
          echo "NEXT_APP_INTERNAL_URL=http://v7-${ENV_NAME}-app:3000" >> .env.${ENV_NAME}
          echo "FRONTEND_SERVICE_URL=http://v7-${ENV_NAME}-app:3000" >> .env.${ENV_NAME}
          echo "FINANCE_SERVICE_URL=http://v7-${ENV_NAME}-finance:3001" >> .env.${ENV_NAME}
          echo "KUMA_URL=http://127.0.0.1:${MONITORING_PORT}" >> .env.${ENV_NAME}
          echo "DB_HOST=${CORE_PREFIX}-db" >> .env.${ENV_NAME}
          echo "REDIS_HOST=${CORE_PREFIX}-redis" >> .env.${ENV_NAME}
          if [ "$ENV_NAME" = "dev" ]; then
            # Inside the shared Docker network the dev database listens on the default port.
            sed -i 's/^DB_PORT=.*/DB_PORT="5432"/' .env.${ENV_NAME}
          fi
          echo "REDIS_PORT=6379" >> .env.${ENV_NAME}

          REDIS_DB_SUFFIX=""
          if [ "$ENV_NAME" = "acc" ]; then
            REDIS_DB_SUFFIX="/1"
          fi

          if [ ! -z "${{ secrets.REDIS_PASSWORD }}" ]; then
            echo "REDIS_URL=redis://default:${{ secrets.REDIS_PASSWORD }}@${CORE_PREFIX}-redis:6379${REDIS_DB_SUFFIX}" >> .env.${ENV_NAME}
          else
            echo "REDIS_URL=redis://${CORE_PREFIX}-redis:6379${REDIS_DB_SUFFIX}" >> .env.${ENV_NAME}
          fi

          # MCP-server (alleen-lezen Samu Bijbel) is opt-in per GitHub Environment (vars.MCP_ENABLED=true).
          # Alle MCP_* waarden komen uit de Environment-eigen secrets/vars; er zijn bewust geen defaults,
          # zodat Acceptance nooit productiecredentials of de productie-SharePointsite gebruikt.
          if [ "${{ vars.MCP_ENABLED }}" = "true" ]; then
            echo "COMPOSE_PROFILES=mcp" >> .env.${ENV_NAME}
            echo "MCP_PUBLIC_URL=${{ vars.MCP_PUBLIC_URL }}" >> .env.${ENV_NAME}
            echo "MCP_ENTRA_TENANT_ID=${{ secrets.AZURE_WEBSITEV7_TENANT_ID }}" >> .env.${ENV_NAME}
            echo "MCP_ENTRA_CLIENT_ID=${{ vars.MCP_ENTRA_CLIENT_ID }}" >> .env.${ENV_NAME}
            echo "MCP_ENTRA_CLIENT_SECRET=${{ secrets.MCP_ENTRA_CLIENT_SECRET }}" >> .env.${ENV_NAME}
            echo "MCP_SHAREPOINT_SITE_ID=${{ vars.MCP_SHAREPOINT_SITE_ID }}" >> .env.${ENV_NAME}
            echo "MCP_ALLOWED_PATH_PREFIX=${{ vars.MCP_ALLOWED_PATH_PREFIX || '/' }}" >> .env.${ENV_NAME}
            echo "MCP_ALLOWED_ORIGINS=${{ vars.MCP_ALLOWED_ORIGINS }}" >> .env.${ENV_NAME}
            echo "MCP_FILES_PATH=${{ vars.MCP_FILES_PATH || '/Sjablonen' }}" >> .env.${ENV_NAME}
            echo "MCP_MAX_DOWNLOAD_BYTES=${{ vars.MCP_MAX_DOWNLOAD_BYTES || '262144' }}" >> .env.${ENV_NAME}
          fi

          compose=(docker compose --env-file ".env.${ENV_NAME}")
          if [ "$ENV_NAME" = "dev" ]; then
            compose+=(-f docker-compose.dev.yml -f docker-compose.dev-images.yml)
          fi
          ACTIVE_SERVICES=$("${compose[@]}" config --services)
          if [ "$ENV_NAME" = "dev" ]; then
            ACTIVE_SERVICES=$(printf '%s\n' "$ACTIVE_SERVICES" | grep -vxF wieisdemol)
          fi
          mapfile -t services <<< "$ACTIVE_SERVICES"

          container_ids() {
            docker ps -aq --filter "label=com.docker.compose.project=v7-${ENV_NAME}" \
              --filter "label=com.docker.compose.service=$1" \
              --filter "label=com.docker.compose.oneoff=False" | sort
          }

          set -o pipefail
          declare -A previous_ids
          for service in "${services[@]}"; do
            previous_ids[$service]=$(container_ids "$service")
          done

          if [ "$ENV_NAME" = "dev" ]; then
            # Monitoring uses a mutable upstream tag and still checks for updates.
            "${compose[@]}" pull monitoring-service
            "${compose[@]}" pull --policy missing "${services[@]}"
            "${compose[@]}" up -d --pull never "${services[@]}"
          else
            "${compose[@]}" pull
            "${compose[@]}" up -d
          fi

          for service in "${services[@]}"; do
            current_ids=$(container_ids "$service")
            if [ -z "$current_ids" ]; then
              result="No container"
            elif [ -z "${previous_ids[$service]}" ]; then
              result="Created"
            elif [ "$current_ids" = "${previous_ids[$service]}" ]; then
              result="Reused"
            else
              result="Recreated"
            fi
            printf 'Container result: %s | %s\n' "$service" "$result"
          done
          # Clean up removed services, preserving the independently maintained production game.
          for CONTAINER_ID in $(docker ps -aq --filter "label=com.docker.compose.project=v7-${ENV_NAME}"); do
            CONTAINER_NAME=$(docker inspect --format '{{.Name}}' "$CONTAINER_ID")
            if [ "$CONTAINER_NAME" = "/v7-prod-wieisdemol" ]; then
              continue
            fi
            SERVICE_NAME=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$CONTAINER_ID")
            ONE_OFF=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.oneoff"}}' "$CONTAINER_ID")
            if [ "$ONE_OFF" != "True" ] && ! printf '%s\n' "$ACTIVE_SERVICES" | grep -Fxq -- "$SERVICE_NAME"; then
              docker rm -f "$CONTAINER_ID"
            fi
          done
          docker image prune -af
          ENDSSH
          {
            printf '### Deployed containers\n\n| Service | Result |\n| --- | --- |\n'
            sed -n 's/^Container result: \([a-zA-Z0-9_-]*\) | \(Created\|Reused\|Recreated\|No container\)$/| `\1` | \2 |/p' "$deploy_log"
          } >> "$GITHUB_STEP_SUMMARY"

  mobile-notifications-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.mobile_setup_action != 'none' && inputs.dev_notifications_action == 'none' && github.ref == 'refs/heads/acceptance'
    uses: ./.github/workflows/mobile-notifications-setup.yml
    with:
      action: ${{ inputs.mobile_setup_action }}
      confirm_isolation: ${{ inputs.mobile_confirm_isolation }}
      test_user_ids: ${{ inputs.mobile_test_user_ids }}
      shared_database_pilot_ack: ${{ inputs.mobile_shared_database_pilot_ack }}
