name: Deploy V7 Core Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/v7-core.yml"

permissions:
  contents: read

jobs:
  deploy-core:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to NetBird VPN
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Wait for VPN routing to be ready
        run: |
          echo "Waiting for SSH port on ${{ secrets.VPN_IP }} to be reachable..."
          for i in {1..30}; do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.VPN_IP }}/22' >/dev/null 2>&1; then
              echo "VPS SSH port is reachable!"
              exit 0
            fi
            echo "VPS SSH port not reachable yet, waiting 2 seconds... ($i/30)"
            sleep 2
          done
          echo "Error: VPS SSH port remained unreachable after 60 seconds."
          exit 1

      - name: Inject Redis Password into databases.json
        run: |
          sed "s/REDIS_PASSWORD_PLACEHOLDER/${{ secrets.REDIS_PASSWORD }}/g" infrastructure/databases.json.template > infrastructure/databases.json

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Copy Infrastructure files to VPS
        run: |
          scp -i ~/.ssh/deploy_key infrastructure/docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }}:/opt/salve-mundi-v7/infra/docker-compose.yml
          scp -i ~/.ssh/deploy_key infrastructure/databases.json ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }}:/opt/salve-mundi-v7/infra/databases.json

      - name: Deploy Core Stack via SSH
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.VPN_IP }} bash << 'ENDSSH'
          set -e
          cd /opt/salve-mundi-v7/infra

          cat > .env << 'EOF'
          PUBLIC_URL="https://${{ secrets.DIRECTUS_HOST }}"
          CORS_ORIGIN="https://${{ secrets.DIRECTUS_HOST }}"
          AUTH_SAFE_REDIRECT_HOSTS="${{ secrets.DIRECTUS_HOST }}"
          VPN_IP="${{ secrets.VPN_IP }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_PORT="${{ secrets.DB_PORT }}"
          DIRECTUS_KEY="${{ secrets.DIRECTUS_KEY }}"
          DIRECTUS_SECRET="${{ secrets.DIRECTUS_SECRET }}"
          AZURE_WEBSITEV7_TENANT_ID="${{ secrets.AZURE_WEBSITEV7_TENANT_ID }}"
          AZURE_WEBSITEV7_DIRECTUS_CLIENT_ID="${{ secrets.AZURE_WEBSITEV7_DIRECTUS_CLIENT_ID }}"
          AZURE_WEBSITEV7_DIRECTUS_CLIENT_SECRET="${{ secrets.AZURE_WEBSITEV7_DIRECTUS_CLIENT_SECRET }}"
          DIRECTUS_STATIC_TOKEN="${{ secrets.DIRECTUS_STATIC_TOKEN }}"
          REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
          MC_WHITELIST_WEBHOOK_URL="${{ secrets.MC_WHITELIST_WEBHOOK_URL }}"
          MC_WHITELIST_WEBHOOK_TOKEN="${{ secrets.MC_WHITELIST_WEBHOOK_TOKEN }}"
          EOF

          docker network create salve-mundi-v7-shared || true
          docker compose -p v7-core stop v7-core-redisinsight || true
          docker volume rm v7-core_v7_core_redisinsight_data || true

          docker compose -p v7-core up -d --remove-orphans
          echo "--- Core Infrastructure Deployed ---"
          ENDSSH
